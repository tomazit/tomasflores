<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Margen — Estudio independiente de diseño</title>
  <desc id="desc">Portada editorial en marfil y bordó con el mensaje Buenas ideas. Diseño con sentido.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbf8f2"/><stop offset="1" stop-color="#eee9e1"/></linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".55" fill="#7b6958" opacity=".16"/><circle cx="6" cy="7" r=".45" fill="#7b6958" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#paper)"/>
  <rect width="1200" height="750" fill="url(#grain)" opacity=".24"/>
  <path d="M0 104H1200" stroke="#332d29" stroke-opacity=".18"/>
  <text x="62" y="68" fill="#25221f" font-family="Arial, Helvetica, sans-serif" font-size="43" letter-spacing="-3">margen<tspan fill="#722536" font-size="16" baseline-shift="super">®</tspan></text>
  <text x="500" y="63" fill="#4e4843" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5">TRABAJOS　　EL ESTUDIO　　QUÉ HACEMOS</text>
  <rect x="1010" y="29" width="133" height="48" fill="#722536"/>
  <text x="1033" y="59" fill="#fffaf4" font-family="Arial, Helvetica, sans-serif" font-size="15">Hablemos ↗</text>
  <circle cx="77" cy="158" r="4" fill="#722536"/>
  <text x="94" y="164" fill="#39322e" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">ESTUDIO INDEPENDIENTE DE DISEÑO</text>
  <text x="1100" y="164" text-anchor="end" fill="#39322e" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5">BUENOS AIRES, ARGENTINA</text>
  <text x="58" y="361" fill="#722536" font-family="Georgia, 'Times New Roman', serif" font-size="135" letter-spacing="-8">Buenas ideas.</text>
  <text x="195" y="510" fill="#722536" font-family="Georgia, 'Times New Roman', serif" font-size="123" letter-spacing="-7">Diseño con <tspan font-style="italic">sentido.</tspan></text>
  <text x="65" y="588" fill="#39322e" font-family="Arial, Helvetica, sans-serif" font-size="23">Le damos forma a lo que te hace diferente.</text>
  <text x="65" y="622" fill="#39322e" font-family="Arial, Helvetica, sans-serif" font-size="23">Marcas con una idea clara y una presencia propia.</text>
  <path d="M65 680H1135" stroke="#5e5650" stroke-opacity=".25"/>
  <text x="65" y="714" fill="#722536" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">IDENTIDAD · EDITORIAL · PACKAGING · DIRECCIÓN DE ARTE</text>
  <text x="1135" y="714" text-anchor="end" fill="#5e5650" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">MARGEN®　/　2026</text>
</svg>
